<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BEKX // VERIFY PAYMENT</title><style>body{margin:0;background:#070707;color:#f2f0ea;font-family:ui-monospace,monospace}.w{width:min(820px,calc(100% - 32px));margin:auto}.top{padding:24px 0;border-bottom:1px solid #292929;display:flex;justify-content:space-between}.g,a{color:#c8a869}main{padding:55px 0}.box{border:1px solid #292929;background:#101010;padding:24px;margin-top:25px}.muted{font:16px/1.65 system-ui;color:#99958e}h1{font-size:clamp(38px,7vw,66px);line-height:1.02}.pill{display:inline-block;border:1px solid #c8a869;color:#c8a869;padding:8px 10px;font-size:11px}</style></head><body><div class=w><header class=top><b>BEKX</b><span class=g>NODE 001.6</span></header><main><span class=pill id=pill>VERIFYING</span><h1 id=title>Checking Stripe payment.</h1><div id=body class=box><p class=muted>BEKX is independently verifying the Checkout Session.</p></div></main></div><script>let q=new URLSearchParams(location.search),sid=q.get('session_id'),token=q.get('token');async function run(){try{let r=await fetch('/api/confirm-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,token})}),d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed');pill.textContent=d.test_mode?'SANDBOX VERIFIED':'LIVE PAYMENT VERIFIED';title.textContent=d.test_mode?'Sandbox payment verified.':'Live payment verified.';body.innerHTML=`<p class=muted>${d.test_mode?'This A$1 transaction is test-only and is not BEKX revenue.':'Stripe verified this live A$1 payment. Revenue was recorded idempotently.'}</p><p><a href="/signal.html?token=${encodeURIComponent(token)}">OPEN ${d.request_code} →</a></p>`;fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).catch(()=>{})}catch(e){pill.textContent='NOT VERIFIED';title.textContent='Payment could not be verified.';body.innerHTML='<p class=muted>'+e.message+'</p>'}}run()</script></body></html>
