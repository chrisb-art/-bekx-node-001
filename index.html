<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BEKX SIGNAL // NODE 001.6</title><style>:root{--b:#080808;--p:#101010;--l:#292929;--t:#f2f0ea;--m:#96938c;--g:#c8a869}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:ui-monospace,monospace}.w{width:min(900px,calc(100% - 34px));margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.g{color:var(--g)}.hero{padding:54px 0 28px}h1{font-size:clamp(40px,7vw,72px);line-height:1.03;margin:0 0 22px}.small{font-family:system-ui;color:var(--m);line-height:1.65;font-size:17px}.panel{border-top:1px solid var(--l);padding:34px 0}label{display:block;color:var(--m);margin:17px 0 8px;font-size:12px}input,textarea,select{width:100%;padding:15px;background:#080808;color:var(--t);border:1px solid #3a3a3a;font:17px ui-monospace}textarea{min-height:150px}button{margin-top:20px;padding:16px 24px;background:var(--g);border:0;font-weight:900;font-size:15px}.badge{display:inline-block;border:1px solid var(--g);padding:8px 10px;color:var(--g);font-size:11px}.price{font-size:34px;margin:18px 0 4px}.result{margin-top:24px;border-top:1px solid var(--l);padding-top:20px}.note{background:var(--p);border:1px solid var(--l);padding:16px;margin-top:22px}</style></head><body><main class=w><header class=top><b>BEKX</b><span class=g>NODE 001.6</span></header><section class=hero><span class=badge id=mode>PAYMENT MODE CHECK</span><h1>Pay. Research.<br>Receive intelligence.</h1><p class=small>Verified checkout with persisted live-search evidence and validated reports.</p></section><section class=panel><div class=price>A$1.00</div><p class=small>One current intelligence report with live web research and cited sources.</p><form id=f><label>TOPIC / COMPANY</label><input id=topic maxlength=240 required><label>QUESTION</label><textarea id=question maxlength=1000></textarea><label>REQUESTER</label><select id=requester><option value=HUMAN>Human</option><option value=MACHINE>Machine / Agent</option><option value=UNKNOWN>Unknown</option></select><button id=btn>CONTINUE TO A$1 CHECKOUT</button></form><div id=result></div><div class=note><div class=g>PRODUCTION CONTROL</div><p class=small id=control>Checking payment mode…</p></div></section></main><script>async function boot(){try{let r=await fetch('/api/services',{cache:'no-store'}),d=await r.json();mode.textContent=d.payment_mode==='live'?'LIVE PAYMENTS':'SANDBOX';control.textContent=d.payment_mode==='live'?'Live Stripe payments enabled. Only independently verified live payments enter BEKX Treasury.':'Sandbox mode: test payments do not enter BEKX Treasury.'}catch{mode.textContent='MODE UNKNOWN';btn.disabled=true}}boot();f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{let r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,question:question.value,requester_type:requester.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Checkout unavailable');location.href=d.url}catch(x){result.innerHTML='<div class="result small">'+x.message+'</div>';btn.disabled=false}};</script></body></html>
