<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BEKX SIGNAL REPORT</title><style>:root{--b:#070707;--p:#101010;--l:#292929;--t:#f2f0ea;--m:#9b9891;--g:#c8a869}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:ui-monospace,monospace}.w{width:min(900px,calc(100% - 32px));margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;font-size:12px}.g,a{color:var(--g)}main{padding:42px 0}.pill{display:inline-block;border:1px solid var(--g);color:var(--g);padding:7px 10px;font-size:10px;margin-top:18px}h1{font-size:clamp(38px,7vw,68px);margin:15px 0 5px;letter-spacing:-.04em}.topic{color:var(--m);font-family:system-ui;margin-bottom:30px}.card{background:var(--p);border:1px solid var(--l);padding:22px;margin:12px 0}.label{color:var(--g);font-size:11px;letter-spacing:.1em;margin-bottom:13px}.text{font:16px/1.65 system-ui;color:#d8d5ce}.item{font:15px/1.55 system-ui;padding:14px 0;border-top:1px solid var(--l)}.audit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--l);padding:15px}.metric b{display:block;color:var(--g);font-size:18px;margin-top:5px}.source{display:block;text-decoration:none;border-top:1px solid var(--l);padding:14px 0}.source span{display:block;color:var(--m);font:12px/1.4 system-ui;word-break:break-all;margin-top:4px}.muted{color:var(--m);font:15px/1.6 system-ui}@media(max-width:560px){.audit{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><div class=w><header class=top><b>BEKX</b><span class=g>NODE 001.6</span></header><main><a href="/">← BEKX SIGNAL</a><div id=app><p class=muted>Retrieving signal…</p></div></main></div><script>const E=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));let token=new URLSearchParams(location.search).get('token'),last='';function arr(a,t){return Array.isArray(a)&&a.length?`<section class=card><div class=label>${t}</div>${a.map(x=>`<div class=item>${E(x)}</div>`).join('')}</section>`:''}async function kick(st){if(st==='RECEIVED')fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).catch(()=>{});if(st==='ANALYSING')fetch('/api/analyse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).catch(()=>{})}async function poll(){try{let r=await fetch('/api/result?token='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error();if(d.status==='AWAITING_APPROVAL'){app.innerHTML=`<span class=pill>AWAITING PAYMENT</span><h1>${E(d.request_code)}</h1><p class=topic>${E(d.topic)}</p>`;return setTimeout(poll,3000)}if(!['COMPLETED','FAILED'].includes(d.status)){app.innerHTML=`<span class=pill>${E(d.status)}</span><h1>${E(d.request_code)}</h1><p class=topic>${E(d.topic)}</p><p class=muted>Each completed stage is persisted before the next begins.</p>`;if(last!==d.status){last=d.status;kick(d.status)}return setTimeout(poll,2200)}if(d.status==='FAILED')return app.innerHTML=`<span class=pill>FAILED</span><h1>${E(d.request_code)}</h1><p class=muted>BEKX refused to publish an incomplete report. Saved evidence remains recoverable.</p>`;let o=d.output||{},m=o._meta||{},src=Array.isArray(o.sources)?o.sources:[],seen=new Set();src=src.filter(s=>{let u=String(s.url||'');if(!u||seen.has(u))return false;seen.add(u);return true}).slice(0,12);app.innerHTML=`<span class=pill>COMPLETED</span><h1>${E(d.request_code)}</h1><p class=topic>${E(d.topic)}</p><section class=card><div class=label>EXECUTIVE SUMMARY</div><div class=text>${E(o.summary)}</div></section>${arr(o.verified_findings,'VERIFIED FINDINGS')}${arr(o.opportunities,'OPPORTUNITIES')}${arr(o.risks,'RISKS')}${arr(o.recommended_path,'RECOMMENDED PATH')}<section class=card><div class=label>CONFIDENCE</div><div class=text>${E(o.confidence)}</div><p class=muted>${E(o.caveats||'')}</p></section><section class=card><div class=label>PROCESS AUDIT</div><div class=audit><div class=metric>ELAPSED<b>${E(m.duration_seconds??'—')}s</b></div><div class=metric>WEB SEARCHES<b>${E(m.web_searches??'—')}</b></div><div class=metric>AI COST USD<b>${m.estimated_gateway_cost_usd!=null?'$'+Number(m.estimated_gateway_cost_usd).toFixed(4):'—'}</b></div></div></section><section class=card><div class=label>SOURCES // ${src.length}</div>${src.map((s,i)=>`<a class=source target=_blank rel=noopener href="${E(s.url)}"><b>${String(i+1).padStart(2,'0')} // ${E(s.title||'Source')}</b><span>${E(s.url)}</span></a>`).join('')}</section>`}catch{setTimeout(poll,3000)}}poll()</script></body></html>
